name: Ledger safety

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.0'
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit --incremental false
      - name: Reservation and crash tests
        run: npm test
        env:
          LEDGER_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Production build
        run: npm run build -- --webpack
      - name: Verify tests and build did not alter real reservations
        run: git diff --exit-code -- src/used-sample-ids.json
