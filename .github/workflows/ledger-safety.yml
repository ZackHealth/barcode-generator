name: Ledger safety

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Type check
        run: bun run typecheck
      - name: Reservation and crash tests
        run: bun run test
        env:
          LEDGER_BASE_REF: ${{ github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || 'origin/main' }}
      - name: Production build
        run: bun run build
      - name: Production Bun API and exports
        run: bun run test:production
      - name: Independently decode ten PDF pages
        run: bun run test:bulk
      - name: Verify tests and build did not alter real reservations
        run: git diff --exit-code -- src/used-sample-ids.json
